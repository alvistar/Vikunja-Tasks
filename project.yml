name: VikunjaWidget
options:
  bundleIdPrefix: net.angstreich
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.0.0"

settings:
  SWIFT_VERSION: "5"
  base:
    # Signing is in Signing.xcconfig (git-ignored) so make gen never clobbers it.
    CODE_SIGN_STYLE: Automatic
    # Xcode recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    REGISTER_APP_GROUPS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CURRENT_PROJECT_VERSION: 96
  # ── Fork addition (Activity plugin) ────────────────────────────────────────
  # The build-time switch. With it unset — i.e. in Scott's tree, which has
  # neither this block nor the Activity/ folders — every `#if VEYRN_ACTIVITY`
  # seam compiles away and the product is his.
  #
  # `DEBUG` is spelled out rather than inherited. xcodegen's own Debug preset
  # writes `SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG` into this very slot, so
  # a value here REPLACES it — `$(inherited)` resolves against the xcconfig
  # above, which does not define it, and Debug builds silently lost `DEBUG`.
  # Verify after `make gen`:
  #   xcodebuild -target VikunjaWidgetApp -configuration Debug -showBuildSettings \
  #     | grep SWIFT_ACTIVE_COMPILATION_CONDITIONS   # → DEBUG VEYRN_ACTIVITY
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG VEYRN_ACTIVITY"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VEYRN_ACTIVITY"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

schemes:
  VikunjaWidgetApp:
    build:
      targets:
        VikunjaWidgetApp: all
        VikunjaWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VikunjaWidgetAppIOS:
    build:
      targets:
        VikunjaWidgetAppIOS: all
        VikunjaWidgetExtensionIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VikunjaWidgetWatch:
    build:
      targets:
        VikunjaWidgetWatch: all
        VikunjaWidgetWatchExtension: all
    run:
      config: Debug
    archive:
      config: Release

  # ── Fork addition (Activity plugin) ──────────────────────────────────────
  # Its own scheme rather than an edit to VikunjaWidgetApp's test action, so
  # every fork-only line in this file sits in one contiguous block.
  VeyrnCoreTests:
    build:
      targets:
        VeyrnCoreTests: [test]
    test:
      config: Debug
      targets:
        - VeyrnCoreTests

targets:
  # ── macOS ────────────────────────────────────────────────────────────────

  VikunjaWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - InfoIOS.plist
          - PendingChangesSheet.swift   # fork: replaced by Activity/PendingChangesSheet.swift
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetApp.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ENABLE_HARDENED_RUNTIME: YES
      # macOS-only Icon Composer icon (VikunjaWidgetApp/AppIconMac.icon). Full-bleed
      # square art; macOS 26 renders it glass/masked, macOS 15 gets actool's
      # rounded-rect legacy rasterisation. A plain .appiconset can't do both —
      # see references/app.md.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
    dependencies:
      - target: VikunjaWidgetExtension
        embed: true
      - package: TelemetryDeck
      - sdk: CloudKit.framework

  VikunjaWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtension.entitlements
    info:
      path: VikunjaWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Veyrn
        CFBundleName: Veyrn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ENABLE_HARDENED_RUNTIME: YES
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── iOS ──────────────────────────────────────────────────────────────────

  VikunjaWidgetAppIOS:
    type: application
    platform: iOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - Info.plist
          - AppIconMac.icon      # macOS-only icon; iOS keeps AppIcon.appiconset
          - PendingChangesSheet.swift   # fork: replaced by Activity/PendingChangesSheet.swift
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetAppIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/InfoIOS.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetExtensionIOS
        embed: true
      - target: VikunjaWidgetWatch
        embed: true
      - package: TelemetryDeck
      - sdk: CloudKit.framework

  VikunjaWidgetExtensionIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtensionIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetExtension/Info.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── watchOS ──────────────────────────────────────────────────────────────
  VikunjaWidgetWatch:
    type: application
    platform: watchOS
    sources:
      - path: VikunjaWidgetWatch
      - path: VikunjaCore
        includes:
          - VikunjaModels.swift
          - VikunjaAPI.swift
          - VikunjaConfig.swift
          - TokenStore.swift
          - QuickAddParser.swift
          - WidgetCache.swift
          - ColorUtils.swift
          - ErrorMessages.swift
          - DiagnosticLog.swift
          - DayLabel.swift
          - Localizable.xcstrings
    entitlements:
      path: VikunjaWidgetWatch/VikunjaWidgetWatch.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.watchkitapp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetWatch/Info.plist
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetWatchExtension
        embed: true
      - package: TelemetryDeck

  VikunjaWidgetWatchExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: VikunjaWidgetWatchExtension
      - path: VikunjaCore
        includes:
          - VikunjaModels.swift
          - VikunjaConfig.swift
          - TokenStore.swift
          - WidgetCache.swift
          - ColorUtils.swift
          - VikunjaAPI.swift
          - ErrorMessages.swift
          - DiagnosticLog.swift
          - DayLabel.swift
          - Localizable.xcstrings
    entitlements:
      path: VikunjaWidgetWatchExtension/VikunjaWidgetWatchExtension.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.watchkitapp.widget
      MARKETING_VERSION: "3.4.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetWatchExtension/Info.plist
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # ── Fork addition (Activity plugin) ──────────────────────────────────────
  VeyrnCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VeyrnCoreTests
      - path: VikunjaCore
        includes:
          - Outbox.swift
          - Activity/CommentOutbox.swift
          - Activity/CommentDrainPolicy.swift
          - Activity/AccountKeyPurge.swift
          - Activity/TaskActivity.swift
          - Activity/TaskActivityModels.swift
          - TaskMerger.swift
          - VikunjaModels.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      MACOSX_DEPLOYMENT_TARGET: "14.0"
